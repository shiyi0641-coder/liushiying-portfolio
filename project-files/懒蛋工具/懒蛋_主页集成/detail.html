<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
    background: #f5f7fc;
    font-family: 'Inter', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    color: #18243d;
    min-height: 100vh;
    padding: 24px;
}

.page { max-width: 1400px; margin: auto; }

.back-btn {
    height: 44px;
    padding: 0 18px;
    border-radius: 12px;
    background: white;
    border: 1px solid #e9edf5;
    display: inline-flex;
    align-items: center;
    gap: 10px;
    font-size: 14px;
    font-weight: 600;
    color: #667085;
    cursor: pointer;
    transition: .2s;
    margin-bottom: 20px;
    text-decoration: none;
}

.back-btn:hover { background: #f8faff; }

.layout {
    display: grid;
    grid-template-columns: 1.6fr 1fr;
    gap: 20px;
}

@media (max-width: 1200px) {
    .layout { grid-template-columns: 1fr; }
}

/* Hero */
.hero {
    background: linear-gradient(135deg, #1e3a8a, #1e40af);
    border-radius: 24px;
    padding: 32px;
    min-height: 240px;
    color: white;
    position: relative;
    overflow: hidden;
}

.hero-tag {
    position: absolute;
    top: 20px;
    right: 20px;
    background: rgba(255,255,255,.15);
    border: 1px solid rgba(255,255,255,.12);
    backdrop-filter: blur(10px);
    padding: 6px 14px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 600;
}

.hero-top { display: flex; justify-content: space-between; gap: 24px; }
.hero-info { display: flex; gap: 20px; align-items: flex-start; }

.tool-icon {
    width: 80px;
    height: 80px;
    border-radius: 20px;
    background: rgba(255,255,255,.14);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 36px;
    flex-shrink: 0;
}

.hero h1 {
    font-size: 32px;
    line-height: 1.2;
    margin-bottom: 12px;
    letter-spacing: -0.5px;
}

.hero-desc {
    max-width: 600px;
    line-height: 1.7;
    font-size: 14px;
    color: rgba(255,255,255,.8);
}

.hero-actions {
    display: flex;
    gap: 12px;
    margin-top: 24px;
}

.hero button {
    height: 44px;
    border: none;
    border-radius: 12px;
    padding: 0 20px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: .2s;
}

.primary-btn {
    background: white;
    color: #1e3a8a;
}

.primary-btn:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(0,0,0,.15); }

.secondary-btn {
    background: rgba(255,255,255,.12);
    border: 1px solid rgba(255,255,255,.16) !important;
    color: white;
}

.secondary-btn:hover { background: rgba(255,255,255,.18); }

/* Tabs */
.tabs {
    display: flex;
    gap: 10px;
    margin-top: 20px;
}

.tab {
    height: 40px;
    padding: 0 18px;
    border-radius: 12px;
    background: white;
    border: 1px solid #e9edf5;
    display: flex;
    align-items: center;
    font-size: 14px;
    font-weight: 600;
    color: #718096;
    cursor: pointer;
    transition: .2s;
}

.tab:hover { background: #f8faff; }

.tab.active {
    background: #eff6ff;
    color: #1e3a8a;
    border-color: #dbeafe;
}

/* Section */
.section {
    background: white;
    border-radius: 20px;
    border: 1px solid #e9edf5;
    padding: 24px;
    margin-top: 16px;
}

.section-title {
    font-size: 18px;
    font-weight: 700;
    margin-bottom: 20px;
    color: #18243d;
}

.overview-text {
    line-height: 1.9;
    color: #667085;
    font-size: 14px;
    margin-bottom: 20px;
}

.tags {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
}

.tag-chip {
    height: 32px;
    padding: 0 14px;
    border-radius: 999px;
    background: #eff6ff;
    color: #1e3a8a;
    display: flex;
    align-items: center;
    font-size: 13px;
    font-weight: 500;
}

/* Feature Grid */
.grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
}

@media (max-width: 768px) {
    .grid { grid-template-columns: 1fr; }
}

.feature-card {
    background: #fbfcff;
    border: 1px solid #e9edf5;
    border-radius: 16px;
    padding: 20px;
    transition: .2s;
}

.feature-card:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 24px rgba(15,23,42,.05);
}

.feature-icon {
    width: 48px;
    height: 48px;
    border-radius: 14px;
    background: #eff6ff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    margin-bottom: 14px;
}

.feature-card h3 {
    font-size: 16px;
    margin-bottom: 8px;
    color: #18243d;
}

.feature-card p {
    color: #7c8797;
    line-height: 1.7;
    font-size: 13px;
}

/* Notes */
.notes-list {
    display: flex;
    flex-direction: column;
    gap: 14px;
    padding-left: 18px;
}

.notes-list li {
    color: #7b8798;
    line-height: 1.8;
    font-size: 14px;
}

.notes-list li::marker { color: #1e3a8a; }

/* Timeline */
.timeline {
    display: flex;
    flex-direction: column;
    gap: 14px;
}

.timeline-item {
    display: flex;
    gap: 16px;
    padding: 16px;
    border-radius: 16px;
    background: #f8faff;
}

.timeline-date {
    min-width: 100px;
    font-size: 13px;
    color: #98a2b3;
    font-weight: 500;
}

.timeline-content h4 {
    margin-bottom: 4px;
    font-size: 15px;
    color: #1e3a8a;
}

.timeline-content p {
    font-size: 13px;
    line-height: 1.7;
    color: #667085;
}

/* Right Panel */
.panel {
    background: white;
    border-radius: 20px;
    border: 1px solid #e9edf5;
    padding: 24px;
    margin-bottom: 16px;
}

.panel h3 {
    margin-bottom: 20px;
    font-size: 17px;
    font-weight: 700;
    color: #18243d;
}

.meta {
    display: flex;
    flex-direction: column;
    gap: 16px;
}

.meta-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding-bottom: 12px;
    border-bottom: 1px solid #edf1f7;
}

.meta-row:last-child { border-bottom: none; padding-bottom: 0; }

.meta-row span {
    color: #7b8798;
    font-size: 14px;
}

.meta-row strong {
    font-size: 14px;
    color: #18243d;
}

/* Steps */
.steps {
    display: flex;
    flex-direction: column;
    gap: 16px;
}

.step {
    display: flex;
    gap: 12px;
    align-items: flex-start;
}

.dot {
    width: 12px;
    height: 12px;
    background: #1e3a8a;
    border-radius: 50%;
    margin-top: 4px;
    flex-shrink: 0;
}

.step h4 {
    margin-bottom: 4px;
    font-size: 14px;
    color: #18243d;
}

.step p {
    font-size: 13px;
    line-height: 1.7;
    color: #7b8798;
}

/* Hidden */
.hidden { display: none !important; }

/* Toast */
#toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    background: #1e3a8a;
    color: white;
    padding: 12px 24px;
    border-radius: 12px;
    font-size: 14px;
    font-weight: 500;
    box-shadow: 0 8px 24px rgba(0,0,0,.15);
    opacity: 0;
    transition: opacity .3s;
    pointer-events: none;
    z-index: 9999;
}

#toast.show { opacity: 1; }
</style>

function getToolId() {
    const params = new URLSearchParams(window.location.search);
    return params.get('tool') || 'questionnaire-import';
}

function renderDetailPage() {
    const toolId = getToolId();
    const data = TOOLS_DB[toolId];
    if (!data) {
        showToast('工具不存在');
        return;
    }

    document.getElementById("toolIcon").innerHTML = data.icon;
    document.getElementById("toolType").innerText = data.type;
    document.getElementById("toolName").innerText = data.name;
    document.getElementById("toolDesc").innerText = data.desc;

    document.getElementById("specVersion").innerText = data.stats.version;
    document.getElementById("specUpdate").innerText = data.stats.lastUpdated;
    document.getElementById("specOwner").innerText = data.stats.owner;
    document.getElementById("specFourthLabel").innerText = data.stats.fourthLabel;
    document.getElementById("specFourthValue").innerText = data.stats.fourthValue;

    document.getElementById("overviewContent").innerHTML = `<p>${data.overview}</p>`;

    document.getElementById("overviewTags").innerHTML = data.tags.map(tag => 
        `<div class="tag-chip">#${tag}</div>`
    ).join('');

    document.getElementById("featuresGrid").innerHTML = data.features.map(f => `
        <div class="feature-card">
            <div class="feature-icon">${f.icon}</div>
            <h3>${f.title}</h3>
            <p>${f.desc}</p>
        </div>
    `).join('');

    document.getElementById("guideSteps").innerHTML = data.guide.map(g => `
        <div class="step">
            <div class="dot"></div>
            <div>
                <h4>${g.step}</h4>
                <p>${g.detail}</p>
            </div>
        </div>
    `).join('');

    document.getElementById("notesList").innerHTML = data.notes.map(n => 
        `<li>${n}</li>`
    ).join('');

    document.getElementById("changelogList").innerHTML = data.changelog.map(c => `
        <div class="timeline-item">
            <div class="timeline-date">${c.date}</div>
            <div class="timeline-content">
                <h4>${c.version}</h4>
                <p>${c.desc}</p>
            </div>
        </div>
    `).join('');
}

function switchTab(tabName, el) {
    document.querySelectorAll(".tab").forEach(tab => tab.classList.remove("active"));
    el.classList.add("active");
    document.querySelectorAll(".tab-content").forEach(content => content.classList.add("hidden"));
    document.getElementById(tabName).classList.remove("hidden");
}

function goBack() {
    const toolId = getToolId();
    const data = TOOLS_DB[toolId];
    if (data && data.type === "HTML") {
        window.location.href = "html-tools.html";
    } else {
        window.location.href = "skills.html";
    }
}

function installTool() {
    const toolId = getToolId();
    const data = TOOLS_DB[toolId];
    if (data.type === "HTML") {
        showToast(`🌐 正在打开 ${data.name}...`);
        setTimeout(() => {
            window.open(`tools/${toolId}.html`, '_blank');
        }, 500);
    } else {
        showToast(`📦 ${data.name} 下载中...`);
        const filename = toolId === 'questionnaire-import' ? 'questionnaire-import.gz' : 
                         toolId === 'questionnaire-check' ? 'questionnaire-check.zip' : 
                         'cross-analysis.gz';
        setTimeout(() => {
            const link = document.createElement('a');
            link.href = `skills/${filename}`;
            link.download = filename;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            showToast('✅ 下载完成！请发送给 MarioClaw');
        }, 800);
    }
}

function toggleFavorite() {
    showToast("✨ 已加入收藏");
}

function showToast(message) {
    const toast = document.getElementById("toast");
    toast.innerText = message;
    toast.classList.add("show");
    setTimeout(() => toast.classList.remove("show"), 3000);
}

// 初始化
